apiVersion: apps/v1
kind: Deployment
metadata:
  name: yopago-keycloak
  namespace: yopago
  labels:
    app: yopago-keycloak
    app.kubernetes.io/name: yopago-keycloak
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: yopago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yopago-keycloak
  template:
    metadata:
      labels:
        app: yopago-keycloak
        app.kubernetes.io/name: yopago-keycloak
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: yopago
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: keycloak
          # Reemplaza <YOUR_ACR_NAME> con el nombre de tu Azure Container Registry
          image: <YOUR_ACR_NAME>.azurecr.io/yopago-keycloak:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            # ===== DB CONFIG =====
            - name: KC_DB
              value: "postgres"
            # KC_DB_URL: host completo desde Azure Portal → tu-servidor.postgres.database.azure.com
            - name: KC_DB_URL
              value: "jdbc:postgresql://<YOUR_AZURE_DB_HOST>.postgres.database.azure.com:5432/keycloak?sslmode=require"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: yopago-db
                  key: DB_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yopago-db
                  key: DB_PASS

            # ===== ADMIN =====
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN_PASSWORD

            # ===== RED / INGRESS =====
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY
              value: "edge"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: yopago-config
                  key: KC_HOSTNAME
            - name: KC_HOSTNAME_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: yopago-config
                  key: KC_HOSTNAME_URL

            # ===== INTEGRACIÓN BACKEND =====
            - name: YOPAGO_BACKEND_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: yopago-config
                  key: YOPAGO_BACKEND_PUBLIC_URL

            # ===== OBSERVABILIDAD =====
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: yopago
  labels:
    app: yopago-keycloak
    app.kubernetes.io/name: yopago-keycloak
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: yopago
spec:
  type: ClusterIP
  selector:
    app: yopago-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
