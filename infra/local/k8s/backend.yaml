apiVersion: apps/v1
kind: Deployment
metadata:
  name: yopago-backend
  namespace: yopago
  labels:
    app: yopago-backend
    app.kubernetes.io/name: yopago-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: yopago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yopago-backend
  template:
    metadata:
      labels:
        app: yopago-backend
        app.kubernetes.io/name: yopago-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: yopago
    spec:
      containers:
        - name: backend
          image: yopago-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "default"
            - name: DB_URL
              value: "jdbc:postgresql://bdd:5432/yopago?sslmode=disable"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: yopago-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_DRIVER
              value: "org.postgresql.Driver"
            - name: HIBERNATE_DDL
              value: "update"
            - name: SHOW_SQL
              value: "true"
            - name: HIBERNATE_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: APP_NAME
              value: "yopago"
            - name: VISION_IA_SERVICE_BASE_URL
              value: "http://vision-ia:8001"
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: yopago-config
                  key: KC_HOSTNAME_URL
            - name: KEYCLOAK_INTERNAL_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: yopago-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_ADMIN_REALM
              value: "master"
            - name: KEYCLOAK_ADMIN_USERNAME
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yopago-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: APP_FRONTEND_BASE_URL
              value: "http://localhost"
---
apiVersion: v1
kind: Service
metadata:
  name: yopago-backend
  namespace: yopago
  labels:
    app: yopago-backend
    app.kubernetes.io/name: yopago-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: yopago
spec:
  type: NodePort
  selector:
    app: yopago-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
