apiVersion: apps/v1
kind: Deployment
metadata:
  name: yopago-keycloak
  namespace: yopago
  labels:
    app: yopago-keycloak
    app.kubernetes.io/name: yopago-keycloak
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: yopago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yopago-keycloak
  template:
    metadata:
      labels:
        app: yopago-keycloak
        app.kubernetes.io/name: yopago-keycloak
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: yopago
    spec:
      containers:
        - name: keycloak
          image: yopago-keycloak:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://bdd:5432/keycloak?sslmode=disable"
            - name: KC_DB_USERNAME
              value: "postgres"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yopago-secrets
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yopago-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY
              value: "edge"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: yopago-config
                  key: KC_HOSTNAME
            - name: KC_HOSTNAME_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: yopago-config
                  key: KC_HOSTNAME_URL
            - name: YOPAGO_BACKEND_URL
              value: "http://yopago-backend:8080"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: yopago
  labels:
    app: yopago-keycloak
    app.kubernetes.io/name: yopago-keycloak
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: yopago
spec:
  type: NodePort
  selector:
    app: yopago-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
